# Wording taken from the committee's own text. Shown on Home, About and (what_is_camelot)
# the homepage banner. Write facts as %key% (see facts: above). Insert with:
#   {% include bunkhouse_summary.html part='what_is_camelot' %}
#   {% include bunkhouse_summary.html part='why' %}
summary:
  what_is_camelot: "The MIT Outing Club's Camelot cabin, set on 20 acres near Rumney, NH, has been a center of the club's activities for nearly 50 years. Countless MITOC members are first introduced to outdoor recreation and camaraderie at events based out of Camelot."
  why: "The existing cabin is nearing the end of its usable life as a place to sleep. Its loft had to be closed because it did not meet modern safety standards, and it reopened only after a major repair effort by the cabin managers, but patches like this can only go so far. Within a few years the cabin will no longer be safe to sleep in, and it can't be brought up to the code required for lodging. The new bunkhouse will give MITOC safe, comfortable sleeping space for %bunkhouse_capacity% people."
# Hero text shown at the top of every /camelot page. The tagline appears
# only in the full hero on the overview page.
hero_title: Camelot bunkhouse
hero_subtitle: Coming 2027
hero_tagline: Phase 1 complete · Phase 2 fundraising now
# Shown in link previews (Slack, email, social posts) and often under the page
# in search results. A page can override it with `description:` in its front matter.
share_description: "MITOC is building a new bunkhouse at Camelot, its cabin near Rumney, NH. Phase 1 is complete; help us raise the rest to build in 2027."
