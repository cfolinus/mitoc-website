# The fundId in donate_link must match facts.fund_number below.
donate_link: &donate_link https://giving.mit.edu/form/?fundId=3892696&amount=1000
# Thermometer: the whole campaign (Phases 1 and 2), including pledges.
# Update donations_as_of whenever the amounts change.
donations_amount: 468000
donations_as_of: November 2026
# Must match facts.total_cost below.
donations_goal: 1300000
# Key project facts, written once and inserted everywhere they appear:
#   pages and includes:  {{ site.data.bunkhouse_settings.facts.total_cost }}
#   bunkhouse_faqs.yml:  %total_cost%  (Liquid doesn't run inside data files)
# Values are strings so they print exactly as written.
# Agreed with the bunkhouse committee, November 2026.
facts:
  total_cost: "$1.3 million"
  bunkhouse_capacity: "50"
  room_count: "five"
  room_size: "10"
  capacity_now: "about 30"
  distance_to_bunkhouse: "about 200 meters"
  walk_from_parking: "about 200 meters"
  parking_spaces: "20"
  groundbreaking: "late spring 2027"
  completion: "fall 2027"
  phase1_raised: "about $300,000"
  phase2_cost: "about $1 million"
  fund_number: "3892696"
number_donors: 314
# Hero text shown at the top of every /camelot page. The tagline appears
# only in the full hero on the overview page.
hero_title: Camelot bunkhouse
hero_subtitle: Coming 2027
hero_tagline: Phase 1 complete · Raising funds to build in 2027
# Shown in link previews (Slack, email, social posts) and often under the page
# in search results. A page can override it with `description:` in its front matter.
share_description: "MITOC is building a new bunkhouse at Camelot, its cabin near Rumney, NH. Phase 1 is complete; help us raise the rest to build in 2027."
