<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% if page.title %}{{ page.title }} · {% endif %}Camelot bunkhouse · MITOC</title>
        <link rel="shortcut icon" type="image/png" href="/images/favicon.ico">
        <link rel="stylesheet" href="/css/bootstrap.min.css">
        <link rel="stylesheet" href="/css/mitoc.css">
        <script defer src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.2/jquery.min.js" integrity="sha384-mXQoED/lFIuocc//nss8aJOIrz7X7XruhR6bO+sGceiSyMELoVdZkN7F0oYwcFH+" crossorigin="anonymous"></script>
        <script defer src="/js/bootstrap.min.js"></script>
        <script defer src="/js/mitoc.js"></script>
    </head>

    <body class="bunkhouse-body">
        {% include navbar.html menu=site.data.bunkhouse_settings.menu class='bunkhouse-navbar' highlight_active=true brand_title='MITOC Bunkhouse' brand_href='/camelot' %}
        <div>
            {{ content }}
        </div>
        <footer class="bunkhouse-footer">
            <div class="container">
                &copy; {{ site.time | date: '%Y' }} <a href="/">MITOC</a>
            </div>
        </footer>
    </body>

</html>
